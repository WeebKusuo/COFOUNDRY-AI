      description: |
        `{state: 'ready', report: InterviewReportView}` or `{state: 'pending', pending: {...,
        retryAllowed}}` (packages/shared/src/report.ts). Scores are computed by the backend with
        rubric-interview-v1; reports support human review and never decide.
      parameters:
