  /matches/{id}/sprints:
    post:
      summary: Propose the trial sprint (either participant; creator is proposer)
      description:
        One sprint per match (409 otherwise). Founder is always reviewer, candidate always contributor.
        Hours are whole 1-10; deadline after now and within 14 days; compensation may keep or improve the
        brief's terms, never lower them (422 with fieldErrors). Criteria ids and the canonical termsHash
        are server-generated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - title
                - scope
                - deliverables
                - criteria
                - expectedHours
                - deadline
                - compensation
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 100
                scope:
                  type: string
                  minLength: 50
                  maxLength: 2000
                deliverables:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    minLength: 1
                    maxLength: 300
                criteria:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    minLength: 1
                    maxLength: 300
                expectedHours:
                  type: integer
                  minimum: 1
                  maximum: 10
                deadline:
                  type: string
                  format: date-time
                  description: UTC; after now and at most 14 days ahead at send and approve
                compensation:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                        - amountMinor
                        - currency
                        - payer
                        - paymentDueDays
                        - methodNote
                      properties:
                        type:
                          const: paid
                        amountMinor:
                          type: integer
                          minimum: 1
                        currency:
                          const: INR
                        payer:
                          const: founder
                        paymentDueDays:
                          type: integer
                          minimum: 1
                          maximum: 30
                        methodNote:
                          type: string
                          minLength: 1
                          maxLength: 300
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                        - benefitDescription
                      properties:
                        type:
                          const: credit_reference
                        benefitDescription:
                          type: string
                          minLength: 20
                          maxLength: 500
                    - type: object
                      additionalProperties: false
                      required:
                        - type
                      properties:
                        type:
                          const: unpaid
      responses:
        '201':
          description: SprintView (version 1, status proposed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /sprints/{id}:
    get:
      summary:
        'SprintParticipant: terms, version, termsHash, history, approvals, submission, review, acknowledgements
        and allowedActions'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SprintView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
    patch:
      summary: Revise terms (proposer; proposed or awaiting_approval)
      description:
        'Increments version, recomputes termsHash, clears ALL approvals and returns to proposed.
        Stale expectedVersion: 409 VERSION_CONFLICT. Active/submitted/reviewed terms cannot be edited.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - expectedVersion
                - changes
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
                changes:
                  type: object
                  additionalProperties: false
                  properties:
                    title:
                      type: string
                      minLength: 1
                      maxLength: 100
                    scope:
                      type: string
                      minLength: 50
                      maxLength: 2000
                    deliverables:
                      type: array
                      minItems: 1
                      maxItems: 5
                      items:
                        type: string
                        minLength: 1
                        maxLength: 300
                    criteria:
                      type: array
                      minItems: 1
                      maxItems: 5
                      items:
                        type: string
                        minLength: 1
                        maxLength: 300
                    expectedHours:
                      type: integer
                      minimum: 1
                      maximum: 10
                    deadline:
                      type: string
                      format: date-time
                      description: UTC; after now and at most 14 days ahead at send and approve
                    compensation:
                      oneOf:
                        - type: object
                          additionalProperties: false
                          required:
                            - type
                            - amountMinor
                            - currency
                            - payer
                            - paymentDueDays
                            - methodNote
                          properties:
                            type:
                              const: paid
                            amountMinor:
                              type: integer
                              minimum: 1
                            currency:
                              const: INR
                            payer:
                              const: founder
                            paymentDueDays:
                              type: integer
                              minimum: 1
                              maximum: 30
                            methodNote:
                              type: string
                              minLength: 1
                              maxLength: 300
                        - type: object
                          additionalProperties: false
                          required:
                            - type
                            - benefitDescription
                          properties:
                            type:
                              const: credit_reference
                            benefitDescription:
                              type: string
                              minLength: 20
                              maxLength: 500
                        - type: object
                          additionalProperties: false
                          required:
                            - type
                          properties:
                            type:
                              const: unpaid
      responses:
        '200':
          description: SprintView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /sprints/{id}/send:
    post:
      summary: "Send the proposal (proposer): records the proposer's approval of the current version"
      description:
        acknowledgeUnpaid=true is required for credit_reference/unpaid terms and refused for
        paid terms.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - expectedVersion
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
                acknowledgeUnpaid:
                  type: boolean
      responses:
        '200':
          description: SprintView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /sprints/{id}/approve:
    post:
      summary: 'Approve (non-proposer): both approvals of the same version and hash start the sprint'
      description:
        expectedVersion and termsHash must match the current terms (409 VERSION_CONFLICT). The
        deadline must still be within the window. Identity comes from the session only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - expectedVersion
                - termsHash
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
                termsHash:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                acknowledgeUnpaid:
                  type: boolean
      responses:
        '200':
          description: SprintView (active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /sprints/{id}/reject:
    post:
      summary: Reject a sent proposal (non-proposer)
      description: Terminal; the match ends. An unsent draft cannot be rejected (409).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - expectedVersion
                - reason
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          description: SprintView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /sprints/{id}/cancel:
    post:
      summary: Cancel (either participant, any non-terminal state)
      description: The match ends; history is kept.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          description: SprintView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /sprints/{id}/submit:
    post:
      summary: Submit the single deliverable link (contributor, active, before the deadline)
      description:
        'HTTPS only; no credentials, localhost, .local, IP literal, fragment or non-standard
        port; <= 2,048 chars. Never fetched by the server. No resubmission (a different link is 409; the
        same link is a harmless repeat). After the deadline: 409 EXPIRED.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - url
                - sharePermissionAcknowledged
              properties:
                url:
                  type: string
                  maxLength: 2048
                note:
                  type: string
                  maxLength: 2000
                sharePermissionAcknowledged:
                  const: true
      responses:
        '200':
          description: SprintView (submitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /sprints/{id}/review:
    post:
      summary: Record the one immutable review (founder) within 7 days of submission
      description:
        Every criterion exactly once with outcome met/partially_met/not_met and a 1-500 character
        reason. Overall outcome is computed (met only if all met, not_met if all not_met). Optional summary
        (extension, 0-2,000 chars).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - criteriaResults
              properties:
                criteriaResults:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - criterionId
                      - outcome
                      - reason
                    properties:
                      criterionId:
                        type: string
                      outcome:
                        enum:
                          - met
                          - partially_met
                          - not_met
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 500
                summary:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: SprintView (reviewed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /sprints/{id}/acknowledge:
    post:
      summary: Acknowledge the outcome (each participant once, within 7 days of the review)
      description:
        Receipt, not agreement; optional disagreement note. Both acknowledgements complete the
        sprint and the match. A repeat returns the current state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - reviewVersion
              properties:
                reviewVersion:
                  type: integer
                  minimum: 1
                disagreementNote:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: SprintView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /blocks:
    post:
      summary: Block a user you have a legitimate relationship with
      description:
        "Interview, request or match with them, or (founders) the candidate appears in your latest
        results; otherwise 404. No self-block (400). In one transaction with the RelationshipGuard: pending
        requests withdrawn, active matches ended and sprints cancelled; pre-submit interviews are cancelled
        and the founder's access to the candidate's assessment ends. The other person only sees 'This
        collaboration is no longer available'."
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - targetUserId
              properties:
                targetUserId:
                  type: string
                  pattern: ^[a-f0-9]{24}$
      responses:
        '201':
          description: BlockView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      summary: Own directed block list (never others' blocks)
      responses:
        '200':
          description: BlockView[]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
  /blocks/{targetUserId}:
    delete:
      summary: Remove your own block (204)
      description: Nothing ended by the block is revived.
      parameters:
        - name: targetUserId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Removed
        '404':
          $ref: '#/components/responses/NotFound'
  /reports:
    post:
      summary: Report misconduct, content or a dispute
      description:
        targetType user|profile|brief|report|sprint with a structured category; the reporter
        must be an affected participant or have legitimate visibility (404 otherwise). A repeat about the
        same target while a case is open links to it (200, linked:true). 10 cases per user per day (429).
        Only the reporter and the assigned moderator can read it.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - targetType
                - targetId
                - category
                - text
              properties:
                targetType:
                  enum:
                    - user
                    - profile
                    - brief
                    - report
                    - sprint
                targetId:
                  type: string
                  pattern: ^[a-f0-9]{24}$
                category:
                  enum:
                    - harassment_or_abuse
                    - inappropriate_content
                    - misrepresentation
                    - spam_or_scam
                    - privacy_violation
                    - sprint_dispute
                    - assessment_error
                    - other
                text:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        '201':
          description: CaseReporterView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /corrections:
    post:
      summary: Request a correction of your own profile or interview report
      description:
        Opens a correction case. Open corrections are shown on the report and request preview
        but never change scores or decide anything.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
