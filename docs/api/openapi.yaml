            maximum: 50
      responses:
        '200':
          description: CaseSummaryView list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'
        '403':
          $ref: '#/components/responses/Error'
  /admin/cases/{id}:
    get:
      summary: One case summary (moderator only; no content)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CaseSummaryView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/cases/{id}/claim:
    post:
      summary: Atomically assign an unclaimed open case to yourself (open -> in_review)
      description:
        'Report and sprint cases also place a 30-day-review dispute hold on the related evidence
        until resolved. Already claimed by another moderator: 409.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
