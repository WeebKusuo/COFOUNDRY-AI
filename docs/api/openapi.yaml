        '409': { $ref: '#/components/responses/Error' }
  /match-requests:
    post:
      summary: Send a collaboration request (founder)
      description:
        Section 11/20. Requires the founder's open brief and that brief's evaluated interview
        report for this candidate (not quarantined), active accounts in one cohort, no block, assessment
        consent still active and current hard gates (409 GATE_CHANGED). One request per (brief, candidate)
        for the brief's lifetime (409 DUPLICATE_PAIR, also after decline/withdrawal/expiry). 20 per founder
        per day (429). Expires 7 days after creation. Another founder's brief or interview returns 404 regardless
        of existing pairs.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - briefId
                - interviewId
                - candidateUserId
                - message
              properties:
                briefId:
                  type: string
                  pattern: ^[a-f0-9]{24}$
                interviewId:
                  type: string
                  pattern: ^[a-f0-9]{24}$
                candidateUserId:
                  type: string
                  pattern: ^[a-f0-9]{24}$
                message:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: MatchRequestView (packages/shared/src/collaboration.ts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      summary: 'Own requests: box=sent (founder) or inbox (candidate)'
      parameters:
        - name: box
          in: query
          required: true
          schema:
            enum:
              - inbox
              - sent
        - name: status
          in: query
          schema:
            enum:
              - pending
              - accepted
              - declined
              - withdrawn
              - expired
        - name: interviewId
          in: query
          schema:
            type: string
            pattern: ^[a-f0-9]{24}$
          description: 'sent box: the request for one interview'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: MatchRequestView list, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'
        '403':
          $ref: '#/components/responses/Error'
