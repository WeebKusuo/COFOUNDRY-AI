        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /interviews/{id}/prepare:
    post:
      summary: Candidate prepares the interview questions from the current resume (idempotent; also started automatically on accept)
      description: |
        Runs in the background: resume_context (projects, contributions, tech stack from the
        redacted resume text) and question_plan (one opening question per planned topic,
        validated: resume quotes verbatim, slot types and difficulty, no repeats). No-op while
        running or when a plan for the current resume version exists; a changed resume makes the
        plan stale and this call prepares it again. 409 RESUME_REQUIRED without a usable resume;
        503 when the AI interviewer is not configured; 429 for one hour after 10 failed preparations in a row.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '200': { $ref: '#/components/responses/InterviewSession' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /interviews/{id}/start:
    post:
      summary: Candidate starts (requires X-Interview-Client; 409 RESUME_REQUIRED without a usable resume, 409 PREPARATION_REQUIRED until the question plan for the current resume is ready; repeated start attaches)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
