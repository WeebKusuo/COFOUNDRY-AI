                - text
              properties:
                targetType:
                  enum:
                    - profile
                    - report
                targetId:
                  type: string
                  pattern: ^[a-f0-9]{24}$
                text:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        '201':
          description: CaseReporterView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /cases:
    get:
      summary: Your reports and correction requests with status and resolution
      parameters:
