openapi: 3.1.0
info:
  title: CoFoundry AI API
  version: 0.14.1
  description: |
    Derived from Implementation Contract v3.0, Sections 17-21. This file grows phase by phase:
    only routes that are implemented and tested are listed (Phase 14 plus the interview-preparation amendment: health, identity, profiles, startup briefs, candidate resume, recommendations, AI interviews and reports, collaboration requests and matches, trial sprints, blocks, reports, corrections and moderation).

    Conventions (Section 17): JSON only; success `{data, requestId}`; list
    `{data, nextCursor, requestId}`; error `{error: {code, message, fieldErrors?}, requestId}`.
    Every route except /health, GET /auth/csrf and POST /auth/login needs a signed-in session
    cookie (401 UNAUTHENTICATED otherwise). Every mutation needs an exact `Origin` and the
    session's `X-CSRF-Token` (403 CSRF_INVALID otherwise). Unknown body fields are rejected (422).
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Liveness only — reveals no internals (Section 18)
      security: []
      responses:
        '200':
          description: Service is alive
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [status]
                    additionalProperties: false
                    properties:
                      status: { type: string, const: ok }
                  requestId: { type: string, format: uuid }
  /auth/csrf:
    get:
      summary: CSRF bootstrap (Section 22)
      description: |
        Creates a 15-minute anonymous session cookie when none exists, then returns a fresh
        synchronizer token for the caller's session. Each call replaces the previous token.
        Never cached. Limited to 30 requests/min per IP.
      security: []
      responses:
        '200':
          description: Token issued (Set-Cookie when a session was created)
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [csrfToken]
                    properties:
                      csrfToken: { type: string }
                  requestId: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      summary: Sign in with a provisioned account; rotates session and CSRF token
      description: |
        Requires the anonymous session's CSRF token and exact Origin. On success the old session
        is deleted and a new cookie is set (8 h absolute, 30 min idle); the client must call
        GET /auth/csrf again. Failures always return the same generic 401. Limits: 5 failed
        attempts per account and 20 per IP per 15 minutes (429 with Retry-After).
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, minLength: 3, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [user]
                    properties:
                      user: { $ref: '#/components/schemas/SessionUser' }
                  requestId: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      summary: Revoke the current session and clear the cookie
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /me:
    get:
      summary: The signed-in user's own identity
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [user, profileSummaries]
                    properties:
                      user: { $ref: '#/components/schemas/SessionUser' }
                      profileSummaries:
                        type: array
                        description: One entry per held role with a saved profile; complete = meets the discovery requirements.
                        items:
                          type: object
                          properties:
                            role: { type: string, enum: [founder, candidate, moderator] }
                            revision: { type: integer }
                            complete: { type: boolean }
                  requestId: { type: string }
        '401': { $ref: '#/components/responses/Error' }
  /candidate/profile:
    get:
      summary: Own candidate profile (revision 0 = never saved). Candidate role required.
      responses:
        '200':
          {
            description: Profile,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      summary: Create (expectedRevision 0) or replace the own candidate profile
      description: |
        Full replacement with optimistic concurrency: 409 VERSION_CONFLICT unless expectedRevision
        equals the stored revision. Drafts may be incomplete while discoveryEnabled is false.
        discoveryEnabled=true requires 1-12 skills, 1-5 industry and mission tags, hours, months,
        opportunityTypes [contributor] and discoveryConsent=true (422 with one field error per gap).
        Skill aliases are resolved; other text is rejected. Project ids and evidenceStatus are
        server-owned; an unknown project id is 422.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateProfileUpdate' }
      responses:
        '200':
          {
            description: Saved profile,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
          }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /founder/profile:
    get:
      summary: Own founder profile (revision 0 = never saved). Founder role required.
      responses:
        '200':
          {
            description: Profile,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
          }
        '403': { $ref: '#/components/responses/Error' }
    put:
      summary: Create or replace the own founder profile
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, bio, companyUrl]
              properties:
                expectedRevision: { type: integer, minimum: 0 }
                bio: { type: string, maxLength: 1000 }
                companyUrl: { type: [string, 'null'], description: 'HTTPS only; null clears it' }
      responses:
        '200':
          {
            description: Saved profile,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
          }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /profiles/{userId}:
    get:
      summary: ProfilePublic projection
      description: |
        Visible for the viewer's own profile, or an active candidate in the same cohort whose
        profile is discoverable with an active disclosure consent. Everything else (private,
        other cohort, suspended, founders, unknown or malformed ids) is 404. Never includes
        email, revision, consent or account fields.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          {
            description: Public profile,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /startups:
    get:
      summary: List briefs (owner list or candidate discovery)
      description: |
        scope=mine (founder role): the session founder's briefs, all states, newest first.
        scope=discover (candidate role): BriefPreview teasers of OPEN briefs from active founders in
        the candidate's cohort (own briefs excluded). Opaque cursor ordered by createdAt then _id,
        default limit 20, max 50. Unknown query parameters are 422.
      parameters:
        - {
            name: scope,
            in: query,
            required: true,
            schema: { type: string, enum: [mine, discover] },
          }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 50 },
          }
      responses:
        '200':
          {
            description: Page,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ListEnvelope' } } },
          }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a draft brief (founder role)
      description: All draft fields optional except title; server fields (status, version, roleKey, opportunityType, workMode, ipPolicyVersion, dates) are rejected.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BriefDraftFields'
              required: [title]
      responses:
        '201':
          {
            description: Draft (version 0),
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
          }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /startups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Brief view decided by the server
      description: |
        Owner: {access: owner, brief: StartupBriefData, preview: BriefPreview}. Active candidate in
        the founder's cohort and the brief is open: {access: preview, preview}. Everyone else,
        drafts, closed briefs and malformed ids: 404. The preview never contains problem,
        solution, team coverage or account fields.
      responses:
        '200':
          {
            description: View,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Edit a draft (owner; version increments on each edit)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, changes]
              properties:
                expectedVersion: { type: integer, minimum: 0 }
                changes: { $ref: '#/components/schemas/BriefDraftFields' }
      responses:
        '200': { description: Updated draft }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: VERSION_CONFLICT (stale version) or INVALID_STATE (not a draft) }
        '422': { $ref: '#/components/responses/Error' }
  /startups/{id}/publish:
    post:
      summary: Publish a draft as open version 1 (owner)
      description: Full validation (Sections 03/13); missing fields are 422 VALIDATION_FAILED with brief.<field> errors; no required skill above team coverage is 422 NO_SKILL_GAP. Repeating on an open brief returns it; a closed brief is 409 INVALID_STATE.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                additionalProperties: false,
                required: [expectedVersion],
                properties: { expectedVersion: { type: integer, minimum: 0 } },
              }
      responses:
        '200': { description: Open brief }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /startups/{id}/close:
    post:
      summary: Close an open brief (owner); drafts are 409 INVALID_STATE
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                additionalProperties: false,
                required: [reason],
                properties: { reason: { type: string, maxLength: 500 } },
              }
      responses:
        '200': { description: Closed brief }
        '409': { $ref: '#/components/responses/Error' }
  /startups/{id}/clone:
    post:
      summary: Copy an owned brief into a new draft (version 0, clonedFromId)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '201': { description: New draft }
        '404': { $ref: '#/components/responses/NotFound' }
  /candidate/resume:
    get:
      summary: Own resume metadata (candidate role)
      responses:
        '200':
          {
            description: CandidateResumeData,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } },
          }
        '403': { $ref: '#/components/responses/Error' }
    put:
      summary: Upload or replace the resume (raw PDF body)
      description: |
        Phase 4 amendment to v3.0 (which deferred uploads): the ONLY route that accepts a non-JSON
        body. Raw application/pdf, max 5 MiB (413), signature checked, text extracted in a bounded
        worker. Malformed, password-protected or too-slow PDFs are 422 and never stored; PDFs without
        text are stored with extraction status no_text. Requires consent header
        X-Resume-Consent: resume-processing-v1, optimistic version header X-Expected-Version
        (0 = none yet) and optional URI-encoded X-Filename (display only). Limited to 10 per hour.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - {
            name: X-Resume-Consent,
            in: header,
            required: true,
            schema: { type: string, const: resume-processing-v1 },
          }
        - {
            name: X-Expected-Version,
            in: header,
            required: true,
            schema: { type: integer, minimum: 0 },
          }
        - { name: X-Filename, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        '200': { description: CandidateResumeData }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      summary: Delete the resume, its extracted text and the processing consent
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: Deleted (idempotent) }
  /candidate/resume/file:
    get:
      summary: Download the original (owner only, attachment, sandboxed)
      responses:
        '200':
          {
            description: PDF,
            content: { application/pdf: { schema: { type: string, format: binary } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /candidate/resume/text:
    get:
      summary: The redacted extracted text future question generation would receive (owner only)
      responses:
        '200': { description: ResumeTextData }
        '404': { $ref: '#/components/responses/NotFound' }
  /startups/{id}/recommendations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Run a match-v3.0 search for an owned open brief and store the batch
      description: |
        Founder owner only (other founders 404, non-founders 403). Pool: active, discoverable,
        consenting candidates of the founder's cohort, never the founder, never blocked. Hard
        gates, then exact Section 04/05 scoring; groups recommendations / provisional / nearMatches,
        top 3 each with unrounded score >= 50. The batch expires after 15 minutes. Draft or closed
        brief -> 409 INVALID_STATE; no skill gap -> 422 NO_SKILL_GAP; more than 1,000
        discoverable candidates -> 503 CAPACITY_LIMIT; 10 searches per minute per founder.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '201':
          {
            description: Search response,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/RecommendationEnvelope' } },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      summary: Latest valid batch for the brief
      description: |
        Re-checks every entry's visibility first and withholds candidates who are no longer
        visible, silently (no count, marker or refill). 409
        STALE_RECOMMENDATION when there is no batch, it expired, the brief closed or changed, or
        any remaining candidate's profile revision changed.
      responses:
        '200':
          {
            description: Search response,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/RecommendationEnvelope' } },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
  /interviews:
    post:
      summary: Invite a candidate from a fresh recommendation batch (founder)
      description: |
        MAT-08 boundary: unexpired batch of the founder's open brief, a listed and still-visible
        candidate, unchanged profile revision and re-passed hard gates, else 409
        STALE_RECOMMENDATION. One interview per brief/candidate pair (409 DUPLICATE_PAIR); 20
        invitations per founder per day (429); expires 7 days after invitation.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [briefId, candidateUserId, batchId]
              properties:
                briefId: { type: string, pattern: '^[a-f0-9]{24}$' }
                candidateUserId: { type: string, pattern: '^[a-f0-9]{24}$' }
                batchId: { type: string, pattern: '^[a-f0-9]{24}$' }
      responses:
        '201': { $ref: '#/components/responses/InterviewSession' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      summary: Own interviews as founder or candidate
      parameters:
        - {
            name: role,
            in: query,
            required: true,
            schema: { type: string, enum: [founder, candidate] },
          }
        - { name: briefId, in: query, schema: { type: string } }
        - {
            name: status,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [invited, accepted, in_progress, coding, submitted, declined, expired, cancelled],
              },
          }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: InterviewSummary list (packages/shared/src/interview.ts) with allowedActions
          content: { application/json: { schema: { $ref: '#/components/schemas/ListEnvelope' } } }
  /interviews/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: X-Interview-Client, in: header, schema: { type: string, format: uuid } }
    get:
      summary: Participant session view (others 404)
      description: |
        InterviewSessionView. Candidate: own turns, drafts, readiness, coding; founder: progress
        only until submission, then transcript, code and report status (unless consent was
        withdrawn). Never includes expected concepts, hidden tests, resume text, prepared question
        prompts or client ids. The candidate's `readiness.questions` reports the question plan:
        status (waiting_for_resume, not_started, preparing, ready, stale, failed), plannedCount,
        basedOn (project names and technologies parsed from their resume), resumeVersion, message.
        `activeElsewhere` is true when another window holds the live room.
      responses:
        '200': { $ref: '#/components/responses/InterviewSession' }
        '404': { $ref: '#/components/responses/NotFound' }
  /interviews/{id}/brief-access:
    post:
      summary: Candidate acknowledges confidentiality; the full brief is released
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [confidentialityAcknowledged, noticeVersion],
                    properties:
                      {
                        confidentialityAcknowledged: { const: true },
                        noticeVersion: { const: 'conf-v3.0' },
                      },
                  },
              },
          }
      responses:
        '200': { $ref: '#/components/responses/InterviewSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /interviews/{id}/accept:
    post:
      summary: Candidate accepts with consents and the current profile revision (409 VERSION_CONFLICT, 409 GATE_CHANGED, 503 when no AI provider)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [briefVersion, profileRevision, consent],
                    properties:
                      {
                        briefVersion: { type: integer },
                        profileRevision: { type: integer },
                        consent:
                          {
                            type: object,
                            required: [policyVersion, items],
                            properties:
                              {
                                policyVersion: { const: 'interview-ai-v1' },
                                items:
                                  {
                                    type: object,
                                    required:
                                      [assessment, external_ai_processing, speech_transcription],
                                    properties:
                                      {
                                        assessment: { type: boolean },
                                        external_ai_processing: { type: boolean },
                                        speech_transcription: { type: boolean },
                                      },
                                  },
                              },
                          },
                      },
                  },
              },
          }
      responses:
        '200': { $ref: '#/components/responses/InterviewSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /interviews/{id}/decline:
    post:
      summary: Candidate declines (terminal)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    properties: { reason: { type: string, maxLength: 500 } },
                  },
              },
          }
      responses:
        '200': { $ref: '#/components/responses/InterviewSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /interviews/{id}/cancel:
    post:
      summary: Either participant cancels before submission
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [reason],
                    properties: { reason: { type: string, minLength: 1, maxLength: 500 } },
                  },
              },
          }
      responses:
        '200': { $ref: '#/components/responses/InterviewSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /interviews/{id}/consent/withdraw:
    post:
