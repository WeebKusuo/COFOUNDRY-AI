        '409':
          $ref: '#/components/responses/Error'
  /admin/cases/{id}/context:
    get:
      summary: Minimum evidence and participant ids (assigned moderator only; audited)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CaseContextView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/cases/{id}/notes:
    post:
      summary: Add an internal note (assigned moderator, in review)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '200':
          description: CaseContextView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /admin/cases/{id}/resolve:
    post:
      summary: Resolve or dismiss (assigned moderator, in review)
      description:
        Quarantine (report targets) and suspension (cases with a target user) require decision=resolved
        and a resolution text. A display correction (report targets) is an attributed overlay; answers,
        numeric scores and consent history are never changed. Suspension revokes sessions and applies the
        deletion termination rules without erasing records. Audited.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - decision
                - resolutionText
                - quarantineReport
                - suspendTarget
              properties:
                decision:
                  enum:
                    - resolved
                    - dismissed
                resolutionText:
                  type: string
                  minLength: 1
                  maxLength: 2000
                displayCorrection:
                  type: string
                  minLength: 1
                  maxLength: 2000
                quarantineReport:
                  type: boolean
                suspendTarget:
                  type: boolean
      responses:
        '200':
          description: CaseContextView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID per user action; stored 24 h per actor and route.
      schema: { type: string, format: uuid }
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  schemas:
    RecommendationEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data:
          type: object
          required:
            [
              batchId,
              briefId,
              briefVersion,
              generatedAt,
              expiresAt,
              algorithmVersion,
              recommendations,
              provisional,
              nearMatches,
              exclusions,
            ]
          properties:
            batchId: { type: string }
            briefId: { type: string }
            briefVersion: { type: integer }
            generatedAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
            algorithmVersion: { type: string, const: match-v3.0 }
            recommendations:
              {
                type: array,
                maxItems: 3,
                items: { $ref: '#/components/schemas/RecommendationEntry' },
              }
            provisional:
              {
                type: array,
                maxItems: 3,
                items: { $ref: '#/components/schemas/RecommendationEntry' },
              }
            nearMatches:
              {
                type: array,
                maxItems: 3,
                items: { $ref: '#/components/schemas/RecommendationEntry' },
              }
            exclusions:
              type: object
              properties:
                totalExcluded: { type: integer }
                gates:
                  type: array
                  items:
                    type: object
                    properties:
                      code:
                        {
                          type: string,
                          enum:
                            [opportunity_type, essential_skill, minimum_hours, minimum_commitment],
                        }
                      count: { type: integer }
    RecommendationEntry:
      type: object
      description: Shapes in packages/shared/src/matching.ts. Scores are unrounded; display two decimals.
      properties:
        candidateUserId: { type: string }
        profileRevision: { type: integer }
        group: { type: string, enum: [recommendations, provisional, nearMatches] }
        score: { type: number }
        components:
          {
            type: object,
            properties:
              {
                S: { type: number },
                A: { type: number },
                I: { type: number },
                P: { type: [number, 'null'] },
              },
          }
        weights: { type: object }
        coverageWeight: { type: number, enum: [1, 0.8] }
        provisional: { type: boolean }
        missingFactors: { type: array, items: { type: string, const: projectRelevance } }
        nearMatchDeficits: { type: array, items: { type: object } }
        reasons: { type: array, items: { type: string } }
        skills: { type: array, items: { type: object } }
        projects: { type: array, items: { type: object } }
        bestProjectId: { type: [string, 'null'] }
        profile:
          { type: object, description: 'ProfilePublic candidate fields and displayName only' }
    ListEnvelope:
      type: object
      required: [data, nextCursor, requestId]
      properties:
        data: { type: array, items: { type: object } }
        nextCursor: { type: [string, 'null'] }
        requestId: { type: string }
    BriefDraftFields:
      type: object
      additionalProperties: false
      description: Writable draft fields (Section 14). Draft text may be short; publish enforces minimums.
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        teaser: { type: string, maxLength: 500 }
        problem: { type: string, maxLength: 3000, description: Confidential }
        solution: { type: string, maxLength: 3000, description: Confidential }
        industryTags: { type: array, maxItems: 5, items: { type: string } }
        missionTags: { type: array, maxItems: 5, items: { type: string } }
        teamSkills:
          type: array
          items:
            {
              type: object,
              additionalProperties: false,
              required: [skillId, level],
              properties:
                { skillId: { type: string }, level: { type: integer, minimum: 0, maximum: 5 } },
            }
        requiredSkills:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [skillId, level, importance, mandatory]
            properties:
              skillId: { type: string }
              level: { type: integer, minimum: 1, maximum: 5 }
              importance: { type: integer, minimum: 1, maximum: 5 }
              mandatory: { type: boolean }
        hoursRequiredPerWeek: { type: [integer, 'null'], minimum: 1, maximum: 40 }
        commitmentMonths: { type: [integer, 'null'], minimum: 1, maximum: 12 }
        mandatoryAvailability: { type: boolean }
        mandatoryCommitment: { type: boolean }
        compensation:
          type: object
          additionalProperties: false
          required: [type, amountMinor, paymentDueDays, methodNote, benefitDescription]
          properties:
            type: { type: string, enum: [paid, credit_reference, unpaid] }
            amountMinor: { type: [integer, 'null'], minimum: 1, description: INR paise }
            paymentDueDays: { type: [integer, 'null'], minimum: 1, maximum: 30 }
            methodNote: { type: string, maxLength: 300 }
            benefitDescription: { type: string, maxLength: 500 }
    DataEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data: { type: object, description: 'Shapes in packages/shared/src/profile.ts' }
        requestId: { type: string }
    CandidateProfileUpdate:
      type: object
      additionalProperties: false
      required:
        [
          expectedRevision,
          headline,
          bio,
          skills,
          industryTags,
          missionTags,
          availableHoursPerWeek,
          commitmentMonths,
          opportunityTypes,
          projects,
          discoveryEnabled,
          discoveryConsent,
        ]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        headline: { type: string, maxLength: 160 }
        bio: { type: string, maxLength: 1000 }
        skills:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required: [skillId, level]
            properties:
              skillId: { type: string }
              level: { type: integer, minimum: 1, maximum: 5 }
        industryTags: { type: array, maxItems: 5, items: { type: string } }
        missionTags: { type: array, maxItems: 5, items: { type: string } }
        availableHoursPerWeek: { type: [integer, 'null'], minimum: 1, maximum: 40 }
        commitmentMonths: { type: [integer, 'null'], minimum: 1, maximum: 12 }
        opportunityTypes: { type: array, maxItems: 1, items: { const: contributor } }
        projects:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [title, description, skillTags, url]
            properties:
              id:
                { type: string, description: 'Existing project id to keep; omit for a new project' }
              title: { type: string, minLength: 1, maxLength: 100 }
              description: { type: string, minLength: 50, maxLength: 1500 }
              skillTags: { type: array, minItems: 1, maxItems: 8, items: { type: string } }
              url: { type: [string, 'null'], description: 'HTTPS only' }
        discoveryEnabled: { type: boolean }
        discoveryConsent: { type: boolean }
    SessionUser:
      type: object
      required: [id, email, displayName, roles, accountMode, emailVerifiedAt]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{24}$' }
        email: { type: string }
        displayName: { type: string }
        roles:
          type: array
          items: { type: string, enum: [founder, candidate, moderator] }
        accountMode: { type: string, enum: [demo, pilot] }
        emailVerifiedAt: { type: [string, 'null'], format: date-time }
    ErrorCode:
      type: string
      enum:
        - BAD_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - CSRF_INVALID
        - NOT_FOUND
        - INVALID_STATE
        - VERSION_CONFLICT
        - STALE_RECOMMENDATION
        - DUPLICATE_PAIR
        - GATE_CHANGED
        - EXPIRED
        - QUESTION_CLOSED
        - IDEMPOTENCY_CONFLICT
        - BODY_TOO_LARGE
        - VALIDATION_FAILED
        - NO_SKILL_GAP
        - RATE_LIMITED
        - INTERNAL_ERROR
        - UPSTREAM_FAILED
        - SERVICE_UNAVAILABLE
        - CAPACITY_LIMIT
    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            fieldErrors:
              type: object
              description: Field path (e.g. body.title) to messages
              additionalProperties:
                type: array
                items: { type: string }
        requestId: { type: string, format: uuid }
  responses:
    InterviewSession:
      description: InterviewSessionView envelope (packages/shared/src/interview.ts) with server-computed allowedActions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DataEnvelope' }
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Unknown or unrelated resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Too many requests (120/min general limit)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
